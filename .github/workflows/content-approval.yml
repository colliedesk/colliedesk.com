name: Content approval

# Required check: an SEO content PR merges only with a fully verified "## Claim check" table in its
# body (scripts/content-approval.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

# No concurrency group: `gh pr create -l` sends "opened" and "labeled" together, and a cancelled run
# can stay on the head commit and block the merge (PR 178). Each run reads the PR as it is now and takes
# seconds, so two runs give the same answer.

jobs:
  content-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/content-approval.mjs
          sparse-checkout-cone-mode: false
      - run: |
          gh pr view "$PR" --json headRefName,labels,body > pr.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR/files" > files.json
          node scripts/content-approval.mjs pr.json files.json
