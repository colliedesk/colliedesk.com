name: Content approval

# Required check: an SEO content PR merges only with a fully verified "## Claim check" table in its
# body (scripts/content-approval.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: content-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/content-approval.mjs
          sparse-checkout-cone-mode: false
      - run: |
          gh pr view "$PR" --json headRefName,labels,body > pr.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR/files" > files.json
          node scripts/content-approval.mjs pr.json files.json
