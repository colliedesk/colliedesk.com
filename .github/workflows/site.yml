name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      product_ref:
        description: >-
          Branch, tag or SHA of colliedesk/colliedesk to build the docs from. Set it to preview
          unmerged docs: the run builds and checks, uploads the site as an artifact, and does
          not deploy. Leave empty to build from main and deploy.
        required: false
        default: ''
  # User guides and the roadmap live in colliedesk/colliedesk, and the founding places left come
  # from Colliedesk Cloud. Every 15 minutes, compare both with what the live site was built from;
  # rebuild only when one differs.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # A scheduled run must not cancel a deploy that is already running; it queues behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIVE_DOCS_VERSION_URL: https://colliedesk.com/product-docs-version.txt
  LIVE_FOUNDING_STATE_URL: https://colliedesk.com/founding-state.txt

jobs:
  freshness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: colliedesk/colliedesk
          path: product
          sparse-checkout: |
            docs/user
            docs/self-host
            ROADMAP.md
          sparse-checkout-cone-mode: false
      - id: compare
        run: |
          current=$(sh scripts/product-docs-version.sh product)
          live=$(curl -fsS --max-time 15 "$LIVE_DOCS_VERSION_URL" || echo unknown)
          founding=$(node scripts/founding-state.mjs)
          live_founding=$(curl -fsS --max-time 15 "$LIVE_FOUNDING_STATE_URL" || echo unknown)
          echo "current=$current live=$live founding=$founding live_founding=$live_founding"
          if [ "$current" = "$live" ] && [ "$founding" = "$live_founding" ]; then echo stale=false; else echo stale=true; fi >> "$GITHUB_OUTPUT"

  check:
    needs: freshness
    if: >-
      !cancelled() &&
      (github.event_name != 'schedule' || needs.freshness.outputs.stale == 'true')
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v5
      # A pull request whose branch also exists in colliedesk/colliedesk builds against that branch,
      # so a docs change that spans both repos can be checked before either side merges.
      - id: product
        env:
          INPUT_REF: ${{ inputs.product_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=$INPUT_REF
          if [ -z "$ref" ] && [ -n "$HEAD_REF" ] &&
            git ls-remote --exit-code --heads https://github.com/colliedesk/colliedesk.git "$HEAD_REF" >/dev/null; then
            ref=$HEAD_REF
          fi
          echo "product ref: ${ref:-main}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: colliedesk/colliedesk
          ref: ${{ steps.product.outputs.ref }}
          path: product
          sparse-checkout: |
            docs/user
            docs/self-host
            ROADMAP.md
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: sh scripts/brand-name-check.sh
      - run: pnpm install --frozen-lockfile
      - run: node scripts/founding-state.mjs > founding-state.json
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: sh scripts/product-docs-version.sh product > _site/product-docs-version.txt
      - run: cp founding-state.json _site/founding-state.txt
      - run: pnpm run check
      - run: pnpm run check:render
      - run: pnpm test
      - run: pnpm run check:content
      # Pages this deploy adds or changes, compared with the live sitemap, for IndexNow after deploy.
      - id: indexnow
        if: github.event_name != 'pull_request'
        run: echo "urls=$(node scripts/indexnow.mjs changed https://colliedesk.com/sitemap.xml _site/sitemap.xml)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      github.event_name != 'pull_request' && !inputs.product_ref
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            public/*.txt
          sparse-checkout-cone-mode: false
      # Bing, and through it ChatGPT search and DuckDuckGo, learn about new pages from IndexNow.
      # The site is already live here, so a refused submission is shown but does not fail the deploy.
      - continue-on-error: true
        env:
          URLS: ${{ needs.check.outputs.indexnow_urls }}
        run: node scripts/indexnow.mjs submit "$URLS"
