name: Competitor watch

# Reads every source URL in src/data/competitors/<slug>.ts once a day and opens a draft pull request
# with the evidence when a page changed a figure we cite (scripts/competitor-watch.mjs). Free: plain
# HTTP GETs on a public-repo runner, no paid API. Off until the owner sets the repository variable
# COMPETITOR_WATCH to "on" (README, "Competitor watch"). Until then the daily run skips its job.
# A manual run is a dry run unless open_prs is ticked: it prints what changed and saves nothing.
on:
  schedule:
    - cron: '30 1 * * *' # 08:30 Vietnam time
  workflow_dispatch:
    inputs:
      open_prs:
        description: Open the pull requests and save what was read (otherwise a dry run).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: competitor-watch
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.COMPETITOR_WATCH == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPEN_PRS: ${{ github.event_name == 'schedule' || inputs.open_prs }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            src
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          package-manager-cache: false
      # The text read last time, per URL. Lost after 7 days without a run: the next run is a baseline.
      - uses: actions/cache/restore@v4
        with:
          path: .competitor-watch/state.json
          key: competitor-watch-${{ github.run_id }}
          restore-keys: competitor-watch-
      - name: Watch
        run: node scripts/competitor-watch-run.mjs ${{ env.OPEN_PRS == 'true' && '--open-prs' || '' }}
      - if: env.OPEN_PRS == 'true' && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .competitor-watch/state.json
          key: competitor-watch-${{ github.run_id }}
