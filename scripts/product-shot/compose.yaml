# Throwaway Colliedesk stack for the product screenshot (public/product-inbox.jpg).
# Driven by scripts/product-shot/run.mjs; nothing here talks to production, staging or real mail.
# Secrets are generated by run.mjs for each run and passed in the environment; Postgres and the
# mail sink publish no host port, and the app listens on 127.0.0.1 only.
name: colliedesk-shot

x-database: &database
  DATABASE_URL: postgres://colliedesk:${SHOT_DB_PASSWORD:?run scripts/product-shot/run.mjs}@postgres:5432/colliedesk?sslmode=disable
  DATABASE_REQUEST_URL: postgres://colliedesk_request:${SHOT_DB_PASSWORD:?}@postgres:5432/colliedesk?sslmode=disable

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: colliedesk
      POSTGRES_USER: colliedesk
      POSTGRES_PASSWORD: ${SHOT_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U colliedesk -d colliedesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${COLLIEDESK_IMAGE:-ghcr.io/colliedesk/colliedesk:edge}
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  server:
    image: ${COLLIEDESK_IMAGE:-ghcr.io/colliedesk/colliedesk:edge}
    environment:
      <<: *database
      APP_ORIGIN: http://localhost:${SHOT_PORT:-55480}
      LISTEN_ADDR: :8080
      # Replies go to the Mailpit sink below; nothing leaves this machine.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      EMAIL_FROM_POLICY: any
      # Inbound mail written by run.mjs carries an Authentication-Results header from this name.
      EMAIL_TRUSTED_AUTHSERV_ID: mx.shot.invalid
      ATTACHMENTS_DIR: /data/attachments
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:${SHOT_PORT:-55480}:8080"
    volumes:
      - attachments-data:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/app/collie", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27

volumes:
  postgres-data:
  attachments-data:
